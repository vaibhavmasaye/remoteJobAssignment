services:
  - type: web
    name: remoteJobAssignment
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ADMIN_IP_ALLOWLIST
        value: "*"
